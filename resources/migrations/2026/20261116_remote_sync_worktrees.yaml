## Remote sync worktrees: checkouts of other branches whose content lives in the same tables as the main app, told
## apart by worktree_id (NULL for the main app). On PostgreSQL the unique keys a worktree copy repeats are unique per
## worktree, and new rows land in the worktree the metabase.worktree_id setting of the connection names, or in the main
## app when it names none.

databaseChangeLog:
  - changeSet:
      id: wtr0tb
      author: ranquild
      comment: Add remote_sync_worktree, a checkout of a remote sync branch whose content lives in the same tables as the main app
      changes:
        - createTable:
            tableName: remote_sync_worktree
            remarks: A checkout of a remote sync branch whose content lives in the same tables as the main app
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  remarks: Unique ID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: branch
                  type: varchar(254)
                  remarks: The remote sync branch the worktree checks out
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: int
                  remarks: The user who created the worktree
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: The timestamp of when the worktree was created
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: The timestamp of when the worktree was last updated
                  constraints:
                    nullable: false

  - changeSet:
      id: wtr0ix
      author: ranquild
      comment: Index the worktrees of a user, which deleting the user updates
      changes:
        - createIndex:
            tableName: remote_sync_worktree
            indexName: idx_remote_sync_worktree_creator_id
            columns:
              - column:
                  name: creator_id

  - changeSet:
      id: wtr1cr
      author: ranquild
      comment: Keep a worktree when the user who created it is deleted
      changes:
        - addForeignKeyConstraint:
            baseTableName: remote_sync_worktree
            baseColumnNames: creator_id
            referencedTableName: core_user
            referencedColumnNames: id
            constraintName: fk_remote_sync_worktree_creator_id
            onDelete: SET NULL

  - changeSet:
      id: wtr2us
      author: ranquild
      comment: Add core_user.worktree_id, the worktree the user works in, or null for the main app
      changes:
        - addColumn:
            tableName: core_user
            columns:
              - column:
                  name: worktree_id
                  type: int
                  remarks: The worktree the user works in, or null for the main app

  - changeSet:
      id: wtr2ix
      author: ranquild
      comment: Index the users of a worktree, which deleting the worktree updates
      changes:
        - createIndex:
            tableName: core_user
            indexName: idx_core_user_worktree_id
            columns:
              - column:
                  name: worktree_id

  - changeSet:
      id: wtr3uf
      author: ranquild
      comment: Move the users of a deleted worktree back to the main app
      changes:
        - addForeignKeyConstraint:
            baseTableName: core_user
            baseColumnNames: worktree_id
            referencedTableName: remote_sync_worktree
            referencedColumnNames: id
            constraintName: fk_core_user_worktree_id
            onDelete: SET NULL

  - changeSet:
      id: wtr8fn
      author: ranquild
      comment: Add metabase_worktree_id(), the worktree the metabase.worktree_id setting of a connection names, 0 for the main app, or null for every worktree when it is unset or empty
      dbms: postgresql
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE FUNCTION metabase_worktree_id() RETURNS INTEGER LANGUAGE sql STABLE AS
                $$ SELECT NULLIF(current_setting('metabase.worktree_id', true), '')::INTEGER $$;
      rollback:
        - sql:
            sql: |
              DROP FUNCTION metabase_worktree_id();

  - changeSet:
      id: wtr4co
      author: ranquild
      comment: Add worktree_id, the worktree of a row or null for the main app, to the tables remote sync syncs, deleting the rows of a worktree with it and, on PostgreSQL, putting new rows in the worktree of the connection
